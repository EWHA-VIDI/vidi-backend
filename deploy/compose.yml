services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    env_file:
      - path: ./backend.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [backend]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
