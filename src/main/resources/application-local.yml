spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3307/vidi?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: "${DB_USERNAME:vidi}"
    password: "${DB_PASSWORD}"

vidi:
  security:
    jwt:
      # Local-only fallback; never reuse it in deployed environments.
      secret: "${JWT_SECRET:local-only-insecure-jwt-secret-change-me}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.vidi: DEBUG
    org.hibernate.SQL: DEBUG
