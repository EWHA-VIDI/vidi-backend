spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3307/vidi?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: "${DB_USERNAME:vidi}"
    password: "${DB_PASSWORD}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.vidi: DEBUG
