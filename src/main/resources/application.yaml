spring:
  application:
    name: vidi-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false