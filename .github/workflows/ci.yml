name: Backend CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vidi
          MYSQL_USER: vidi
          MYSQL_PASSWORD: ci-only-password
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports: ["3307:3306"]
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql --host=127.0.0.1 --protocol=TCP --user=vidi --database=vidi --execute='SELECT 1' --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/vidi?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: vidi
      DB_PASSWORD: ci-only-password
      SPRING_PROFILES_ACTIVE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-reports
          path: build/reports/
