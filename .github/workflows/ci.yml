name: Backend CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vidi
          MYSQL_USER: vidi
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/vidi?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: vidi
      DB_PASSWORD: ci-only-password
      SPRING_PROFILES_ACTIVE: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build test ktlintCheck detekt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-reports
          path: build/reports/
