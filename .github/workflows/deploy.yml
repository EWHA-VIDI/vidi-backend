name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Reviewed frontend commit (full 40-character SHA)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PARAMETER_PREFIX: ${{ vars.SSM_PARAMETER_PREFIX }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FRONTEND_SHA: ${{ inputs.frontend_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment inputs
        run: |
          [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$AWS_REGION" && test -n "$PARAMETER_PREFIX" && test -n "$INSTANCE_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EWHA-VIDI/vidi-frontend
          ref: ${{ inputs.frontend_sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon bootJar
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push reviewed images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          test -n "$BACKEND_REPOSITORY" && test -n "$FRONTEND_REPOSITORY"
          BACKEND_IMAGE="$REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA"
          FRONTEND_IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$FRONTEND_SHA"
          docker buildx build --load -t "$BACKEND_IMAGE" .
          docker buildx build --load --build-context infra=./deploy -f deploy/frontend.Dockerfile -t "$FRONTEND_IMAGE" ./frontend
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"
      - name: Deploy with SSM and verify remote readiness
        run: |
          python3 scripts/send-deploy-command.py > "$RUNNER_TEMP/deploy-parameters.json"
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/deploy-parameters.json" --query Command.CommandId --output text)
          bash deploy/wait-for-command.sh "$command_id" "$INSTANCE_ID"
